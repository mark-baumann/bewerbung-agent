person:
  vorname: Max
  nachname: Mustermann
  email: max.mustermann@example.de
  telefon: "+49 151 23456789"
  strasse: Musterstrasse 12
  plz: "10115"
  ort: Berlin
  land: Deutschland
  geburtsdatum: "1990-05-17"
  linkedin: https://www.linkedin.com/in/mustermann
  github: https://github.com/mustermann
  website: ""

# Freitext. Geht in Bewertung und Anschreiben ein - je konkreter, desto besser.
kurzprofil: >
  Softwareentwickler mit sechs Jahren Erfahrung im Backend, Schwerpunkt Python
  und verteilte Systeme. Zuletzt Teamlead fuer eine Zahlungsplattform mit
  40.000 Transaktionen taeglich. Erfahrung mit Kubernetes, PostgreSQL und
  Event-Streaming. Sucht eine Rolle mit technischer Tiefe und Homeoffice-Anteil.

suche:
  was:
    - Softwareentwickler Python
    - Backend Entwickler
    - Site Reliability Engineer
  wo: München
  umkreis: 30                      # km
  veroeffentlicht_seit_tagen: 14   # API kennt 0, 7, 14, 30, 100
  nur_vollzeit: true
  nur_homeoffice: false
  max_pro_query: 40
  quellen:
    - arbeitsagentur
    - get-in-it

# Automatischer Ablauf. Cron ruft alle 5 Minuten `bewerbungsagent tick` auf
# (im Docker-Container eingebaut, lokal: `bewerbungsagent cron`); der Tick
# startet den Lauf, sobald der Zeitplan faellig ist. Vorbereitete Bewerbungen
# gehen erst nach deinem "Ja" auf der Startseite raus.
automatisierung:
  aktiv: true
  modus: automatisch             # automatisch | nur_suchen | aus
  cron: "0 6 * * *"              # taeglich um 06:00 Uhr (deutsche Zeit)
  max_pro_lauf: 5                # so viele Bewerbungen bereitet ein Lauf vor
  max_pro_tag: 10                # Sicherheitsgrenze fuer Sendungen pro Tag
  probelauf_vorab: true          # Online-Formular vorab testweise ausfuellen
  ziel_pro_woche: 5              # Wochenziel (z. B. aus der Eingliederungsvereinbarung)

# Angaben, die Bewerbungsformulare oft als Pflichtfeld abfragen
angaben:
  anrede: Herr                   # Herr | Frau | divers
  verfuegbar_ab: ab sofort
  kuendigungsfrist: keine
  gehaltsvorstellung: "60.000 EUR brutto/Jahr"
  arbeitserlaubnis: deutsche Staatsangehoerigkeit
  fuehrerschein: Klasse B
  sprachen: Deutsch (Muttersprache), Englisch (C1)

bewertung:
  # Pflicht-Skills: bestimmen die fachliche Passung
  skills:
    - Python
    - PostgreSQL
    - Docker
    - Kubernetes
    - REST
    - CI/CD
    - Git
  # Wunschthemen: geben Bonuspunkte
  wunsch:
    - Homeoffice
    - Kafka
    - Terraform
    - unbefristet
  # Harte Ausschlusskriterien: Stelle wird sofort verworfen
  ausschluss:
    - Zeitarbeit
    - Arbeitnehmerueberlassung
    - Praktikum
    - Ausbildung
    - Provisionsbasis
  min_score: 60
  modell: claude-opus-5
  effort: medium                   # low | medium | high | xhigh | max
  # Wird ueber "Nein - Arbeitgeber nie wieder vorschlagen" gefuellt
  ausschluss_arbeitgeber: []

unterlagen:
  lebenslauf: unterlagen/lebenslauf.pdf
  zeugnisse:
    - unterlagen/zeugnisse.pdf
  anschreiben_stil: >
    sachlich und konkret, ohne Werbefloskeln, maximal 250 Woerter,
    Sie-Anrede, ein Absatz zur Motivation und einer zu den passenden Faehigkeiten
