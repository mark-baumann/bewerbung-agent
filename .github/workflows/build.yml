# ═══════════════════════════════════════════════════════════════
# build.yml — Build & Push des Bewerbungsagent-Images nach GHCR
# ═══════════════════════════════════════════════════════════════
# Der Bewerbungsagent ist ein CLI-Werkzeug (kein Dauerläufer), daher gibt es
# hier keinen Deploy auf den Pi. Dieser Workflow baut das Image und stellt es
# in der GitHub Container Registry bereit, damit es überall laufen kann.
#
#   docker pull ghcr.io/mark-baumann/bewerbung-agent:latest

name: Build

on:
  push:
    branches: [main, master, claude/bewerbungsagent-browser-use-0z5rg2]
  pull_request:
    branches: [main, master, claude/bewerbungsagent-browser-use-0z5rg2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mark-baumann/bewerbung-agent:latest
            ghcr.io/mark-baumann/bewerbung-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
