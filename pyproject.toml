[project]
name = "bewerbungsagent"
version = "0.1.0"
description = "Agent der Stellenangebote der Arbeitsagentur holt, semantisch/sentiment-basiert bewertet, speichert und per browser-use tatsaechlich bewirbt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "anthropic>=0.69",
]

[project.optional-dependencies]
browser = [
    "browser-use>=0.7",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bewerbungsagent = "bewerbungsagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bewerbungsagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
